name: Deploy to cPanel via FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ftp-deploy:
    runs-on: [self-hosted, windows, x64]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # خیلی مهم: .git را در workspace نگه نمی‌داریم
          fetch-depth: 1
      
      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          server-dir: /Rev01/
          
          # تنظیمات پایداری
          timeout: 600000
          log-level: standard
          security: loose  # برای FTPS روی هاست اشتراکی
          
          # فایل state برای ردیابی تغییرات
          state-name: .ftp-deploy-sync-state.json
          
          # مهم‌ترین بخش: exclude کامل
          exclude: |
            **/.git/**
            **/.git*
            .git/**
            .git*
            **/.github/**
            **/.vscode/**
            **/.ai-memory/**
            **/.DS_Store
            **/Thumbs.db
            **/.env*
            **/node_modules/**
            **/vendor/**
            **/cache/**
            **/tmp/**
            **/temp/**
            **/logs/**
            **/*.log
            
            # فایل‌های حساس و پیکربندی
            **/config.php
            **/config.example.php
            **/secrets.json
            **/credentials.json
            **/.htpasswd*
            **/.ftp-deploy-sync-state.json
            
            # داده‌های runtime (هرگز overwrite نشوند)
            **/data/db.json
            **/data/auth_user.json
            **/data/auth_lock.json
            **/data/backups/**
            **/data/*.json
            **/settings.json
            **/data/.htaccess*
            
            # فایل‌های تست و توسعه
            **/_scan.php
            **/_selftest.php
            **/test.php
            **/debug.php
            **/PROJECT_BRAIN_Stracture.md
            **/AGENTS.md
            **/AI_CONTEXT.md
            **/README.md

      - name: Wait before retry
        if: failure()
        run: Start-Sleep -Seconds 10
        shell: powershell

      - name: Retry FTP Deploy (attempt 2)
        if: failure()
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          server-dir: /Rev01/
          timeout: 600000
          security: loose
          state-name: .ftp-deploy-sync-state.json
          exclude: |
            **/.git/**
            **/.git*
            .git/**
            .git*
            **/.github/**
            **/.vscode/**
            **/.ai-memory/**
            **/config.php
            **/data/**
            **/settings.json
            **/_scan.php
            **/_selftest.php
            **/AGENTS.md
            **/AI_CONTEXT.md